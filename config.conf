# mango entry point. Each file in config/ owns one topic, same layout as the
# Hyprland config. Order matters: later files override earlier ones, and
# programs.conf must come first because the others use its variables.
# Check for mistakes without restarting:  mango -c ~/.config/mango/config.conf -p

source=./config/programs.conf      # default apps ($term, $files, $browser, $island)
source=./config/monitors.conf      # outputs (this machine's; edit freely)
source=./config/environment.conf   # env vars, cursor, icon theme
source=./config/autostart.conf     # programs started at login
source=./config/appearance.conf    # gaps, borders, rounding, blur, animations
source=./config/input.conf         # keyboard, touchpad, gestures
source=./config/tags.conf          # tags (= Hyprland workspaces) and layout
source=./config/keybinds.conf      # all binds (Quickshell binds included)
source=./config/window-rules.conf  # window rules

# machine-only tweaks that never go in the repo
source_optional=./local.conf
