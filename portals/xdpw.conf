# ~/.config/xdg-desktop-portal-wlr/config (install.sh writes it from this,
# with @HOME@ filled in, since the portal doesn't expand ~)
# When an app asks to share: click a window to share just that window, or a
# display to share the whole screen (scripts/share-picker). Escape cancels.
# Read only when the portal starts (log out and in, or rerun scripts/portals).
[screencast]
chooser_type=simple
chooser_cmd=@HOME@/.config/mango/scripts/share-picker
max_fps=60
