# Gentoo desktop (ASRock B850M Pro-A WiFi, RX 9060 XT). install.sh links this
# to ~/.config/mango/machine.conf there (or: install.sh --machine desktop).
# Same layout as hyprland-dotfiles' monitors.lua and workspaces.lua.
#   rr: 0 normal, 1 = 90°, 2 = 180°, 3 = 270° (Hyprland transform 3 = rr:3)

# Samsung LS27DG30X: main screen, workspaces 1-5
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:180,x:0,y:0,scale:1,rr:0
# Philips 221V8LB: to the right, turned vertical, workspaces 6-10
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:100,x:1920,y:0,scale:1,rr:3
# the occasional extra screens (from monitors.lua; ignored when not plugged in)
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:60,x:3000,y:0,scale:1,rr:0
monitor_rule=name:^HDMI-A-2$,width:1920,height:1080,refresh:60,x:4920,y:0,scale:1.5,rr:0

# ── Workspaces like Hyprland's: 1-5 live on the Samsung, 6-10 on the Philips ──
# mango gives every screen its own tags, so Super+6 shows tag 1 of the Philips
# (the island shows it as 1 there). Super+Shift+number moves the window across.
bind=SUPER,1,viewcrossmon,1,DP-2
bind=SUPER,2,viewcrossmon,2,DP-2
bind=SUPER,3,viewcrossmon,3,DP-2
bind=SUPER,4,viewcrossmon,4,DP-2
bind=SUPER,5,viewcrossmon,5,DP-2
bind=SUPER,6,viewcrossmon,1,HDMI-A-1
bind=SUPER,7,viewcrossmon,2,HDMI-A-1
bind=SUPER,8,viewcrossmon,3,HDMI-A-1
bind=SUPER,9,viewcrossmon,4,HDMI-A-1
bind=SUPER,0,viewcrossmon,5,HDMI-A-1
bind=SUPER+SHIFT,1,tagcrossmon,1,DP-2
bind=SUPER+SHIFT,2,tagcrossmon,2,DP-2
bind=SUPER+SHIFT,3,tagcrossmon,3,DP-2
bind=SUPER+SHIFT,4,tagcrossmon,4,DP-2
bind=SUPER+SHIFT,5,tagcrossmon,5,DP-2
bind=SUPER+SHIFT,6,tagcrossmon,1,HDMI-A-1
bind=SUPER+SHIFT,7,tagcrossmon,2,HDMI-A-1
bind=SUPER+SHIFT,8,tagcrossmon,3,HDMI-A-1
bind=SUPER+SHIFT,9,tagcrossmon,4,HDMI-A-1
bind=SUPER+SHIFT,0,tagcrossmon,5,HDMI-A-1
