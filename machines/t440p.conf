# ThinkPad T440p. install.sh links this to ~/.config/mango/machine.conf on the
# ThinkPad (or: install.sh --machine t440p). Find screen names with wlr-randr.
#
# monitor_rule=name:^eDP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,rr:0
#   rr: 0 normal, 1 = 90°, 2 = 180°, 3 = 270° (Hyprland transform 3 = rr:3)
# Leaving out width/height/refresh uses the screen's native mode, so this keeps
# working if the panel is swapped. Positions must stay positive (XWayland bug).

# ThinkPad screen
monitor_rule=name:^eDP-1$,x:0,y:0,scale:1,rr:0

# Any external screen: to the right of the laptop, native mode
monitor_rule=name:^(DP|HDMI)-.*,x:1920,y:0,scale:1,rr:0

# ── Workspaces (tags): every screen has its own 1-10 ──
# Super+1..9,0 switch on the screen you're on; Super+Shift+number moves the window there
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10
