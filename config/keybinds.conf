# Ported 1:1 from Hyprland's keybinds.lua.
# Syntax: bind[flags]=MODS,key,command,args   (flags: l = also on the lock screen)
# Held keys repeat on their own in mango, so Hyprland's `repeating` needs no flag.
# Variables ($term, $files, $browser, $island) come from programs.conf.

# ── Applications ──
bind=SUPER,Return,spawn,$term
bind=SUPER,e,spawn,$files
bind=SUPER,b,spawn,$browser

# ── Quickshell (the island) ──
bind=ALT,space,spawn,$island launcher
bind=ALT,Tab,spawn,$island windows
bind=ALT+SHIFT,Tab,spawn,$island windowsPrev
bind=SUPER,n,spawn,$island hub
bind=SUPER,s,spawn,$island openTab search
bind=SUPER,c,spawn,$island control
bind=SUPER,l,spawn,$island lock
# power menu (middle of the screen)
bind=SUPER,Escape,spawn,$island power
bind=SUPER,d,spawn,$island dnd
bind=SUPER,m,spawn,$island micmute
bind=SUPER+SHIFT,b,spawn,$island nightlight
bind=SUPER+SHIFT,s,spawn,$island screenshot region
bind=SUPER+SHIFT,r,spawn,$island record

# ── Session ──
bind=SUPER,r,reload_config
bind=CTRL+ALT,Delete,spawn,doas /sbin/reboot

# ── Windows ──
bind=SUPER,q,killclient
bind=SUPER,v,togglefloating
bind=SUPER,j,dwindle_toggle_current_split
# Super+F = maximize (bar/island and gaps stay), Super+Shift+F = real fullscreen
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
# Hyprland's Super+P (pseudotile) has no mango equivalent, so it's left unbound

# ── Focus ──
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# ── Workspaces (tags): Super+number / Super+Shift+number live in machine.conf,
# because they differ per machine (the desktop splits 1-5 / 6-10 across screens) ──
# Super + scroll: next/previous workspace that has windows (Hyprland e+1 / e-1)
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# ── Mouse: move / resize ──
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ── Screenshots (Hyprland used hyprshot; the island's script does the same here) ──
# Super+Print = click a window, Shift+Print = this display, Super+Shift+Print = drag a box
bind=SUPER,Print,spawn,$island screenshot window
bind=SHIFT,Print,spawn,$island screenshot output
bind=SUPER+SHIFT,Print,spawn,$island screenshot region

# ── Media keys (also work on the lock screen) ──
# Play and Pause share one key on some keyboards (the ThinkPad), so those two
# match by key name (s flag) instead of key position, or they would conflict.
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindls=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindls=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop
