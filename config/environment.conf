# Session. mango sets XDG_CURRENT_DESKTOP=mango itself and passes WAYLAND_DISPLAY
# etc. to D-Bus, so the portals read mango-portals.conf. Don't override it.
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,mango

# Where screenshots go (the island's screenshot script reads SCREENSHOT_DIR)
env=XDG_PICTURES_DIR,~/Pictures
env=SCREENSHOT_DIR,~/Pictures/Screenshots

# Cursor. mango uses XCursor themes only (no Hyprcursor), and exports
# XCURSOR_THEME / XCURSOR_SIZE from these for apps.
cursor_theme=Adwaita
cursor_size=28

# Icon theme used by Quickshell (launcher, Alt+Tab, notifications)
env=QS_ICON_THEME,Papirus

# Qt/GTK apps on Wayland
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=MOZ_ENABLE_WAYLAND,1
