# Ported from Hyprland's window-rules.lua.

# suppress-maximize-events: apps can't maximize themselves (layout stays in charge)
window_rule=ignore_maximize:1,app_id:.*

# Hyprland's other two rules aren't needed here:
#   fix-xwayland-drags  works around a Hyprland-only XWayland drag bug
#   move-hyprland-run   was for Hyprland's own run dialog
