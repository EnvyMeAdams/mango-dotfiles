# Ported from Hyprland's window-rules.lua.

# suppress-maximize-events: apps can't maximize themselves (layout stays in charge)
window_rule=ignore_maximize:1,app_id:.*

# ── animation extras ──
# Terminal drops in: kitty slides in from the nearest screen edge (from below
# when it's the only window). Mango picks the edge itself; it can't be forced
# to come from the top.
window_rule=animation_type_open:slide,app_id:^kitty$

# Floating windows pop: mango rules can't match "is floating", so this lists
# the usual popups/dialogs. They zoom in from 90% with a soft overshoot.
window_rule=animation_type_open:zoom,animation_type_close:zoom,app_id:^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|xdg-desktop-portal-gtk|org.gnome.Calculator|qalculate-gtk|mpv|imv)$
window_rule=animation_type_open:zoom,animation_type_close:zoom,title:^(Open|Save|File Upload|Choose|Select|Enter name|Rename|Print|Properties|Preferences)

# Hyprland's other two rules aren't needed here:
#   fix-xwayland-drags  works around a Hyprland-only XWayland drag bug
#   move-hyprland-run   was for Hyprland's own run dialog
