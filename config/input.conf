# Ported from Hyprland's input.lua.

# ── keyboard (kb_layout us; Hyprland's default repeat) ──
xkb_rules_layout=us
repeat_rate=25
repeat_delay=600
numlock_on=0

# ── focus (follow_mouse 1) ──
# focus follows the mouse; the cursor jumps to windows you focus by keyboard
sloppy_focus=1
warp_cursor=1
# Hyprland's focus_on_activate is off: apps can't steal focus
# (the island's Alt+Tab still switches, it activates through foreign-toplevel)
focus_on_activate=0
focus_cross_monitor=1
focus_cross_tag=0

# ── touchpad (natural_scroll true) ──
tap_to_click=1
tap_and_drag=1
drag_lock=0
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_accel_speed=0.0
trackpad_scroll_method=1

# ── mouse (sensitivity 0, flat-ish like Hyprland's default) ──
mouse_natural_scrolling=0
mouse_accel_speed=0.0

# ── gestures ──
# Hyprland: 3-finger horizontal swipe = switch workspace (follows your fingers).
# mango does the same live while you swipe (gesture_live). Swipe left = next tag.
gesture_live=1
gesturebind=none,left,3,viewnext_have_client
gesturebind=none,right,3,viewprev_have_client

