# Ported from Hyprland's appearance.lua + hyprland-gui.lua.
# Gaps: outer gaps are uniform. The extra space under the Dynamic Island is
# added by Quickshell (a layer-shell reservation) only on the monitor you're
# using, so do NOT enlarge the top gap here.

# ── gaps (gaps_in 5, gaps_out 20) ──
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=20
gap_outer_vertical=20
smart_gaps=0

# ── borders (border_size 2) ──
# Hyprland's active border was a gradient (#77767b -> #dc8add, 45°); mango
# borders are one colour, so it uses the pink end. Colours are 0xRRGGBBAA.
border_px=2
focus_color=0xdc8addff
border_color=0x595959aa
urgent_color=0xad401fff
maximized_screen_color=0xdc8addff
no_border_when_single=0
root_color=0x1a1a1aff

# ── rounding (rounding 10) ──
border_radius=10
no_radius_when_single=0

# ── opacity (active/inactive 1.0) ──
focused_opacity=1.0
unfocused_opacity=1.0

# ── shadows (range 4, colour 0xee1a1a1a ARGB = 0x1a1a1aee RGBA) ──
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=4
shadows_blur=8
shadows_position_x=0
shadows_position_y=0
shadows_color=0x1a1a1aee

# ── blur (size 3, passes 1, vibrancy 0.17), behind see-through windows like kitty ──
blur=1
blur_layer=0
blur_optimized=1
blur_params_radius=3
blur_params_num_passes=1
blur_params_noise=0.0117
blur_params_brightness=0.8172
blur_params_contrast=0.8916
blur_params_saturation=1.17

# ── animations: smooth & calm (macOS-feel, Hyprland flavour) ──
# Tiled windows fade in where they land while the others glide aside;
# closing windows fade out. Durations sit next to the island's own timings
# (~180-320ms) so the shell and the windows move at the same pace.
# Per-app extras (kitty slides in, dialogs pop) live in window-rules.conf.
animations=1
layer_animations=1
animation_type_open=fade
animation_type_close=fade
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
# pop size for windows that zoom (dialogs): start at 90%, shrink to 94% on close
zoom_initial_ratio=0.9
zoom_end_ratio=0.94
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_open=280
animation_duration_close=200
animation_duration_move=260
animation_duration_tag=320
animation_duration_focus=0
# open: a soft settle with a tiny overshoot (only visible on zoom/slide windows)
animation_curve_open=0.25,1.12,0.4,1
# everything else: gentle ease-out, no bounce
animation_curve_close=0.4,0,0.2,1
animation_curve_move=0.22,1,0.36,1
animation_curve_tag=0.22,1,0.36,1
animation_curve_focus=0.22,1,0.36,1
animation_curve_opacity_fade_in=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.4,0,0.2,1
# the island (and its wallpaper, lock saver) animate themselves; no mango animation on top
layer_rule=animation_type_open:none,layer_name:^island
layer_rule=animation_type_close:none,layer_name:^island

# ── dwindle (preserve_split = true) ──
# Like Hyprland's dwindle: split axis from the window's shape, new window on
# the side the cursor is on, splits kept when a window closes.
dwindle_split_ratio=0.5
dwindle_smart_split=0
dwindle_horizontal_split=0
dwindle_vertical_split=0
dwindle_preserve_split=1
dwindle_manual_split=0
dwindle_drop_simple_split=1
