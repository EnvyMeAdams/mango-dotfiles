# Started once at login (exec_once runs through sh, so ~ and pipes work).
# Same list as Hyprland's autostart.lua, with the Hyprland-only parts swapped:
#   hyprpolkitagent        -> polkit-gnome (official Gentoo binary)
#   xdg-portal-hyprland    -> scripts/portals (xdg-desktop-portal-wlr)
#   dbus-update-activation -> dropped, mango does it itself
exec_once=mkdir -p ~/Pictures/Screenshots ~/Videos/Recordings
# join the keyring that login (PAM) already unlocked to this session's D-Bus
exec_once=gnome-keyring-daemon --start --components=secrets
exec_once=gentoo-pipewire-launcher
exec_once=~/.config/mango/scripts/portals
exec_once=/usr/libexec/polkit-gnome-authentication-agent-1
exec_once=quickshell
exec_once=signal-desktop
exec_once=kdeconnect-indicator
# OpenCloud sync client (skips itself if the AppImage isn't there)
exec_once=~/.config/mango/scripts/opencloud
exec_once=island-greeter-sync --watch
exec_once=~/.config/mango/scripts/wallpaper-colors --watch
